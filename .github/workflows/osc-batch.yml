# OSC fork CI wrapper - generated by scripts/make_wrapper.py;
# check with scripts/verify_wrapper.py before pushing.
# Jobs kept (verbatim, except the two sanctioned adaptations:
# checkout pinned to ${{ inputs.target_ref }}, and the inserted
# Provenance step):
#   - changes
#   - test
# DELIBERATELY EXCLUDED (loud):
#   - adr-numbers: not in the keep list
#   - lint: not in the keep list
#   - typecheck: not in the keep list
#   - coverage-badge: not in the keep list
#   - build: not in the keep list
#   - e2e: not in the keep list
#   - docs-build: not in the keep list

name: OSC batch mutant probe

on:
  workflow_dispatch:
    inputs:
      target_ref:
        description: 'Git branch, tag, or 40-character commit SHA to validate'
        required: true
        type: string
      mutants:
        description: 'JSON array of mutant refs (branches or SHAs) to probe'
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: osc-batch-${{ github.repository }}-${{ inputs.target_ref }}
  cancel-in-progress: true
env:
  APT_OPTS: -o Acquire::Retries=3 -o Acquire::http::Timeout=15 -o Acquire::https::Timeout=15
  DROP_AZURE_MIRROR: sudo sed -i 's|http://azure.archive.ubuntu.com/ubuntu|http://archive.ubuntu.com/ubuntu|g'
    /etc/apt/apt-mirrors.txt 2>/dev/null || true
jobs:
  osc_provenance:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
      with:
        ref: ${{ inputs.target_ref }}
    - name: Provenance
      shell: bash
      run: |
        set -euo pipefail
        echo "tested_target_ref=${{ inputs.target_ref }}"
        checked_out_sha="$(git rev-parse HEAD)"
        if [[ ! "$checked_out_sha" =~ ^[0-9a-f]{40}$ ]]; then
          echo "::error::git rev-parse HEAD did not produce a 40-character commit SHA: $checked_out_sha"
          exit 1
        fi
        printf 'checked-out SHA: %s\n' "$checked_out_sha"
  changes:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      issues: read
      pull-requests: read
    outputs:
      code: ${{ steps.filter.outputs.code }}
      website: ${{ steps.filter.outputs.website }}
    steps:
    - id: gate
      env:
        GH_TOKEN: ${{ github.token }}
        EVENT: ${{ github.event_name }}
        DRAFT: ${{ github.event.pull_request.draft }}
        PR: ${{ github.event.pull_request.number }}
      run: |
        if [ "$EVENT" != pull_request ] || [ "$DRAFT" != true ]; then
          echo 'run=true' >> "$GITHUB_OUTPUT"; exit 0
        fi
        for attempt in 1 2; do
          labels="$(gh api "repos/$GITHUB_REPOSITORY/issues/$PR/labels" --jq '[.[].name]')"
          echo "Labels (read $attempt): $labels"
          if jq -e 'index("agent-pr") or index("agent-authored")' <<< "$labels" > /dev/null; then
            echo 'run=true' >> "$GITHUB_OUTPUT"; exit 0
          fi
          if [ "$attempt" -eq 1 ]; then sleep 20; fi
        done
        echo 'run=false' >> "$GITHUB_OUTPUT"
        echo '::notice::Draft without an agent label - lint, typecheck, test, build and e2e are skipped.'
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      if: steps.gate.outputs.run == 'true'
      with:
        ref: ${{ matrix.mutant }}
        fetch-depth: 0
    - id: filter
      if: github.event_name == 'pull_request' && steps.gate.outputs.run == 'true'
      env:
        BASE_REF: ${{ github.base_ref }}
      run: "git fetch --no-tags origin \"$BASE_REF\"\nchanged=$(git diff --name-only\
        \ \"origin/${BASE_REF}...HEAD\")\necho \"Changed files:\"; printf '%s\\n'\
        \ \"$changed\"\n# Anything outside this list is code. Note .github/workflows\
        \ is NOT here \u2014\n# a change to CI itself must run CI. The evidence include\
        \ list is the one\n# document that is also code: the renderer build and the\
        \ jsdom tests read it\n# to decide what the React Compiler skips (scripts/react-compiler.ts).\n\
        include_list='docs/specs/2026-07-31-evidence-affecting-paths-assessment.md'\n\
        if printf '%s\\n' \"$changed\" | grep -qvE '^(docs/|website/|\\.claude/|\\\
        .github/ISSUE_TEMPLATE/|CONTEXT\\.md$|LICENSE$|[^/]*\\.md$)' \\\n  || printf\
        \ '%s\\n' \"$changed\" | grep -qxF \"$include_list\"; then\n  echo 'code=true'\
        \ >> \"$GITHUB_OUTPUT\"\nelse\n  echo 'code=false' >> \"$GITHUB_OUTPUT\"\n\
        \  echo '::notice::No code paths changed \u2014 lint, typecheck, test, build\
        \ and e2e are skipped.'\nfi\n# This file is in the docs-site list for the\
        \ same reason .github/workflows is\n# absent from the code list above: `docs-build`\
        \ is defined here, so a change to\n# it must run it. Without that, the job's\
        \ first real execution would be on some\n# later website/ PR, and an environment\
        \ fault in it would fail a change that had\n# nothing to do with it.\nif printf\
        \ '%s\\n' \"$changed\" | grep -qE '^(website/|\\.github/workflows/ci\\.yml$)';\
        \ then\n  echo 'website=true' >> \"$GITHUB_OUTPUT\"\nelse\n  echo 'website=false'\
        \ >> \"$GITHUB_OUTPUT\"\n  echo '::notice::Nothing under website/ changed\
        \ \u2014 docs-build is skipped.'\nfi\n"
    strategy:
      matrix:
        mutant: ${{ fromJSON(inputs.mutants) }}
      fail-fast: false
  test:
    runs-on: ubuntu-latest
    needs: changes
    if: github.event_name != 'pull_request' || needs.changes.outputs.code == 'true'
    timeout-minutes: 20
    outputs:
      coverage-lines: ${{ steps.coverage-badge.outputs.lines }}
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with:
        ref: ${{ matrix.mutant }}
        fetch-depth: 0
    - name: Mutant artifact id
      shell: bash
      run: |
        printf 'OSC_MUTANT_ID=%s\n' "$(printf '%s' "${{ matrix.mutant }}" | tr -c 'A-Za-z0-9._-' '-')" >> "$GITHUB_ENV"
    - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413
    - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
      with:
        node-version-file: .nvmrc
        cache: pnpm
    - name: Install native build dependencies
      timeout-minutes: 5
      run: |
        ${{ env.DROP_AZURE_MIRROR }}
        sudo apt-get $APT_OPTS update
        sudo apt-get $APT_OPTS install -y build-essential python3
    - run: pnpm install
    - name: Verify openssl is available
      run: openssl version
    - run: pnpm test:coverage
      env:
        BIRDBRAIN_REQUIRE_OPENSSL: '1'
    - name: Read measured line coverage
      id: coverage-badge
      run: node scripts/coverage-badge.mjs measure >> "$GITHUB_OUTPUT"
    - name: Diff coverage
      if: github.event_name == 'pull_request'
      run: |
        git fetch --no-tags origin "${BASE_REF}"
        node scripts/diff-coverage.mjs --base "origin/${BASE_REF}"
      env:
        BASE_REF: ${{ github.base_ref }}
    - name: Mutant verdict (killed)
      if: failure()
      shell: bash
      run: |
        printf 'MUTANT %s: killed\n' "${{ matrix.mutant }}" | tee -a "$GITHUB_STEP_SUMMARY" "$GITHUB_WORKSPACE/osc-mutant-results.txt"
    - name: Mutant verdict (survived)
      if: success()
      shell: bash
      run: |
        printf 'MUTANT %s: survived\n' "${{ matrix.mutant }}" | tee -a "$GITHUB_STEP_SUMMARY" "$GITHUB_WORKSPACE/osc-mutant-results.txt"
    - name: Upload mutant results
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: mutant-results-${{ strategy.job-index }}-${{ env.OSC_MUTANT_ID }}
        path: ${{ github.workspace }}/osc-mutant-results.txt
    strategy:
      matrix:
        mutant: ${{ fromJSON(inputs.mutants) }}
      fail-fast: false
    continue-on-error: true
